<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Panel Comercial</title>

  <style>
    :root{
      --navy: #0B1D4A;
      --navy-2:#08163A;
      --bg:   #F4F6F9;
      --card: #FFFFFF;
      --line: #D9DEE7;
      --text: #1F2A44;
      --muted:#6B7280;
      --danger:#B91C1C;
      --shadow: 0 2px 10px rgba(16,24,40,.08);
      --radius: 10px;

      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--bg); color:var(--text); }

    /* ===== TOPBAR (banner + buscador) ===== */
    .topbar{ background:#fff; border-bottom:1px solid var(--line); }

    .brand-banner{
      background:#fff;
      padding: 18px 16px 8px;
      display:flex;
      justify-content:center;
      align-items:center;
      height: 126.406px;
    }
    .brand-banner img{
      
      width: 443.281px;
      height: auto;
      display:block;
    }

    .topbar-inner{
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 16px 14px;
      display:flex;
      justify-content:center; /* buscador centrado bajo el logo */
      align-items:center;
    }

    .global-search{
      width: min(980px, 100%); /* ancho tipo Salesforce */
      display:flex;
      align-items:center;
      gap:10px;
      border:1px solid var(--line);
      border-radius:6px;
      padding:10px 12px;
      background:#fff;
    }
    .global-search svg{ opacity:.7; flex:0 0 auto; }
    .global-search input{
      width:100%;
      border:0;
      outline:0;
      font-size:13px;
      color:var(--text);
    }
    .global-search input::placeholder{ color:#9AA3B2; }

    /* ===== NAVBAR ===== */
    .navbar{ background:var(--navy); }
    .navbar-inner{
      max-width: 1280px;
      margin:0 auto;
      padding:0 8px;
      display:flex;
      align-items:center;
      gap:6px;
      overflow:auto;
    }
    .nav-item{
      display:flex;
      align-items:center;
      gap:8px;
      padding:12px 12px;
      color:rgba(255,255,255,.92);
      text-decoration:none;
      font-size:0,875rem;
      border-radius:6px;
      white-space:nowrap;
      cursor:pointer;
      user-select:none;
    }
    .nav-item:hover{ background:var(--navy-2); }
    .nav-item.active{ background:rgba(255,255,255,.14); }

    /* ===== LAYOUT ===== */
    .wrap{
      max-width: 1280px;
      margin:0 auto;
      padding:16px;
      display:grid;
      grid-template-columns: 1.75fr 1fr;
      gap:14px;
      align-items:start;
    }
    @media (max-width: 1000px){
      .topbar-inner{ justify-content:stretch; }
      .wrap{ grid-template-columns:1fr; }
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .card-h{
      padding:12px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .card-h .title{ font-size:14px; font-weight:950; letter-spacing:.2px; }
    .card-b{ padding:12px; }
    .hide{ display:none !important; }

    /* ===== CTA ===== */
    .cta{
      width:100%;
      background:#0B0B0B;
      color:#fff;
      border:0;
      border-radius:6px;
      padding:12px 14px;
      font-weight:950;
      cursor:pointer;
      margin-bottom:12px;
    }
    .cta:hover{ opacity:.92; }

    /* ===== TOOLS HOME GRID ===== */
    .tools-grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap:10px;
    }
    .tool{
      display:flex;
      gap:12px;
      align-items:center;
      padding:12px;
      border:1px solid #E6EAF2;
      border-radius:10px;
      text-decoration:none;
      color:var(--text);
      background:#fff;
      transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
    }
    .tool:hover{
      transform: translateY(-1px);
      border-color:#CAD3E3;
      box-shadow:0 6px 18px rgba(16,24,40,.10);
    }
    .tool-ico{
      width:42px; height:42px;
      border-radius:10px;
      border:1px solid #E2E8F0;
      background:#F2F5FB;
      display:grid; place-items:center;
      overflow:hidden;
      flex: 0 0 auto;
    }
    .tool-ico img{ width:26px; height:26px; object-fit:contain; display:block; }
    .tool-ico .fallback{ font-weight:950; color:#243B7A; font-size:13px; }

    .tool-txt{ min-width:0; }
    .tool-name{ font-weight:950; font-size:14px; margin:0; line-height:1.15; }
    .tool-desc{ margin:3px 0 0; font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tool-meta{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }

    /* Tags / buttons */
    .tag{
      font-size:11px;
      font-weight:900;
      border:1px solid #E4E9F3;
      background:#F7F9FD;
      color:#334155;
      padding:3px 8px;
      border-radius:999px;
    }
    .tag.red{
      border-color: rgba(185,28,28,.25);
      background: rgba(185,28,28,.08);
      color: var(--danger);
    }

    .btn{
      display:inline-flex; align-items:center; gap:8px;
      border:1px solid #E4E9F3;
      background:#fff;
      color:var(--text);
      text-decoration:none;
      font-weight:900;
      font-size:12px;
      padding:7px 10px;
      border-radius:999px;
    }
    .btn:hover{ border-color:#CAD3E3; }
    .btn.red{
      border-color: rgba(185,28,28,.25);
      background: rgba(185,28,28,.06);
      color: var(--danger);
    }
    .btn.primary{
      background: var(--navy);
      border-color: var(--navy);
      color:#fff;
    }
    .btn.primary:hover{
      background: var(--navy-2);
      border-color: var(--navy-2);
    }

    /* Sidebar feeds */
    .feed{ display:grid; gap:10px; }
    .feed-item{
      border:1px solid #E6EAF2;
      border-radius:10px;
      padding:10px;
      background:#fff;
    }
    .feed-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .feed-title{ font-weight:950; font-size:13px; margin:0; line-height:1.2; }
    .feed-date{ font-size:12px; color:#8A94A6; white-space:nowrap; }
    .feed-text{ margin:6px 0 0; font-size:12.5px; color:var(--muted); line-height:1.35; }
    .feed-actions{ margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }

    .muted-note{ margin-top:10px; color:#8A94A6; font-size:12px; }

    /* ===== PAGES (tabs) ===== */
    .page-title{ font-size:16px; font-weight:950; margin:0; }
    .page-sub{ margin:6px 0 0; color:var(--muted); font-size:12.8px; line-height:1.35; }

    .info-grid{
      margin-top:12px;
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap:10px;
    }
    .info-box{
      border:1px solid #E6EAF2;
      border-radius:10px;
      padding:12px;
      background:#fff;
    }
    .info-box h3{ margin:0; font-size:13.5px; font-weight:950; }
    .info-box p{ margin:6px 0 0; color:var(--muted); font-size:12.6px; line-height:1.35; }
    .info-box ul{ margin:8px 0 0 18px; color:var(--text); font-size:12.6px; line-height:1.35; }
    .info-actions{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }

    /* HERO visual */
    .tool-hero{
      grid-column: 1 / -1;
      display:flex;
      gap:12px;
      align-items:flex-start;
      padding:12px;
      border:1px solid #E6EAF2;
      border-radius:10px;
      background: linear-gradient(180deg, #FFFFFF, #F7F9FD);
    }
    .tool-hero-ico{
      width:56px; height:56px;
      border-radius:14px;
      border:1px solid #E2E8F0;
      background:#F2F5FB;
      display:grid; place-items:center;
      overflow:hidden;
      flex: 0 0 auto;
    }
    .tool-hero-ico img{ width:34px; height:34px; object-fit:contain; display:block; }
    .tool-hero-ico .fallback{ font-weight:950; color:#243B7A; font-size:14px; }
    .tool-hero-main{ flex:1 1 auto; min-width:0; }
    .tool-hero-title{ margin:0; font-size:15.5px; font-weight:950; line-height:1.15; }
    .tool-hero-desc{ margin:6px 0 0; color:var(--muted); font-size:12.8px; line-height:1.35; }
    .tool-hero-actions{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }

    .badge-row{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    .badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:5px 10px;
      border-radius:999px;
      border:1px solid #E4E9F3;
      background:#F7F9FD;
      color:#334155;
      font-size:11.5px;
      font-weight:900;
    }
    .badge.red{
      border-color: rgba(185,28,28,.25);
      background: rgba(185,28,28,.08);
      color: var(--danger);
    }

    .steps{
      margin:8px 0 0;
      padding-left:18px;
      color: var(--text);
      font-size:12.6px;
      line-height:1.4;
    }
    .steps li{ margin:6px 0; }
  </style>
</head>

<body>
  <header class="topbar">
    <!-- Banner con HRmotor grande -->
    <div class="brand-banner">
      <img src="LOGO-HRMOTOR-RGB_SIN-CLAIM-2.png" alt="HRmotor · Vende rápido · Compra fácil">
    </div>

    <!-- Buscador (sin usuario ni logo pequeño) -->
    <div class="topbar-inner">
      <div class="global-search" aria-label="Búsqueda global">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2"/>
          <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" placeholder="Search…" />
      </div>
    </div>
  </header>

  <!-- Navbar -->
  <nav class="navbar" aria-label="Navegación">
    <div class="navbar-inner">
      <a class="nav-item active" data-view="tools" href="#" onclick="return false;" title="Inicio">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z"
                stroke="white" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </a>

      <a class="nav-item" data-page="acceso_web" href="#" onclick="return false;">Acceso Web</a>
      <a class="nav-item" data-page="my_mutua" href="#" onclick="return false;">My Mutua</a>
      <a class="nav-item" data-page="serviceform" href="#" onclick="return false;">Serviceform</a>
      <a class="nav-item" data-page="whatsapp_web" href="#" onclick="return false;">WhatsApp Web</a>
      <a class="nav-item" data-page="lendismart" href="#" onclick="return false;">Lendismart</a>
      <a class="nav-item" data-page="docusign" href="#" onclick="return false;">DocuSign</a>
      <a class="nav-item" data-page="woffu" href="#" onclick="return false;">Woffu</a>
    </div>
  </nav>

  <main class="wrap">
    <div>
      <!-- Home -->
      <section id="toolsCard" class="card" aria-label="Herramientas">
        <div class="card-h">
          <div class="title">Herramientas</div>
          <div style="color:var(--muted); font-size:12px; font-weight:900;">Accesos directos</div>
        </div>
        <div class="card-b">
          <div id="tools" class="tools-grid"></div>
          <div class="muted-note">
            Nota: los accesos se abren en una nueva pestaña para evitar bloqueos por iframes (SharePoint/SSO).
          </div>
        </div>
      </section>

      <!-- Tabs pages -->
      <section id="pageCard" class="card hide" aria-label="Información">
        <div class="card-h">
          <div class="title" id="pageHeader">Información</div>
          <div style="color:var(--muted); font-size:12px; font-weight:900;" id="pageMeta">—</div>
        </div>
        <div class="card-b">
          <p class="page-title" id="pageTitle">—</p>
          <p class="page-sub" id="pageIntro">—</p>
          <div id="pageContent" class="info-grid"></div>
        </div>
      </section>
    </div>

    <aside>
      <button class="cta" type="button" onclick="alert('Acción a definir: enlazar a Salesforce / crear tarea');">
        Crear tarea
      </button>

      <section class="card" aria-label="Comunicados">
        <div class="card-h">
          <div class="title">Comunicados</div>
          <div id="commCount" style="color:var(--muted); font-size:12px; font-weight:900;">—</div>
        </div>
        <div class="card-b">
          <div id="comunicados" class="feed"></div>
        </div>
      </section>

      <div style="height:12px;"></div>

      <section class="card" aria-label="Noticias">
        <div class="card-h">
          <div class="title">Noticias</div>
          <div id="newsCount" style="color:var(--muted); font-size:12px; font-weight:900;">—</div>
        </div>
        <div class="card-b">
          <div id="noticias" class="feed"></div>
        </div>
      </section>
    </aside>
  </main>

  <!-- Datos -->
  <script src="content.js?v=99"></script>

  <script>
    const safe = (v) => (v ?? '').toString();
    const esc = (s) => safe(s).replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    }[m]));
    const FALLBACK = (name) => (name || 'H').trim().slice(0,2).toUpperCase();

    function renderTools(){
      const root = document.getElementById('tools');
      root.innerHTML = '';
      const tools = (window.TOOLS || []);

      tools.forEach(t => {
        const a = document.createElement('a');
        a.className = 'tool';
        a.href = t.url || '#';
        a.target = '_blank';
        a.rel = 'noopener';

        const icon = safe(t.icon);
        const group = safe(t.group);
        const badge = safe(t.badge);
        const status = safe(t.status);

        a.innerHTML = `
          <div class="tool-ico">
            ${icon ? `<img src="${esc(icon)}" alt="">` : `<div class="fallback">${esc(FALLBACK(t.name))}</div>`}
          </div>
          <div class="tool-txt">
            <p class="tool-name">${esc(t.name || '')}</p>
            <p class="tool-desc">${esc(t.desc || '')}</p>
            <div class="tool-meta">
              ${group ? `<span class="tag">${esc(group)}</span>` : ``}
              ${badge ? `<span class="tag">${esc(badge)}</span>` : ``}
              ${status ? `<span class="tag red">${esc(status)}</span>` : ``}
            </div>
          </div>
        `;

        const img = a.querySelector('img');
        if(img){
          img.addEventListener('error', () => {
            img.remove();
            a.querySelector('.tool-ico').innerHTML = `<div class="fallback">${esc(FALLBACK(t.name))}</div>`;
          });
        }

        root.appendChild(a);
      });
    }

    function renderFeed(list, containerId, countId){
      const el = document.getElementById(containerId);
      const countEl = document.getElementById(countId);
      const items = (list || []).slice();

      if(countEl) countEl.textContent = items.length ? `${items.length}` : '—';

      el.innerHTML = '';
      items.forEach(n => {
        const div = document.createElement('div');
        div.className = 'feed-item';

        const title = esc(n.title || '');
        const date = esc(n.date || '');
        const text = esc(n.text || '');
        const link = safe(n.link);
        const pdf = safe(n.pdf);
        const image = safe(n.image);

        div.innerHTML = `
          <div class="feed-top">
            <p class="feed-title">${title}</p>
            <span class="feed-date">${date}</span>
          </div>
          <p class="feed-text">${text}</p>
          <div class="feed-actions">
            ${link ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Abrir enlace</a>` : ''}
            ${pdf ? `<a class="btn red" href="${esc(pdf)}" target="_blank" rel="noopener">Ver PDF</a>` : ''}
            ${image ? `<a class="btn" href="${esc(image)}" target="_blank" rel="noopener">Ver imagen</a>` : ''}
          </div>
        `;
        el.appendChild(div);
      });
    }

    function setActiveNav(el){
      document.querySelectorAll('.nav-item').forEach(a => a.classList.remove('active'));
      if(el) el.classList.add('active');
    }

    function showTools(){
      document.getElementById('toolsCard').classList.remove('hide');
      document.getElementById('pageCard').classList.add('hide');
    }

    function showPage(pageKey){
      const pages = (window.PAGES || {});
      const page = pages[pageKey];

      document.getElementById('toolsCard').classList.add('hide');
      document.getElementById('pageCard').classList.remove('hide');

      const header = document.getElementById('pageHeader');
      const meta = document.getElementById('pageMeta');
      const title = document.getElementById('pageTitle');
      const intro = document.getElementById('pageIntro');
      const content = document.getElementById('pageContent');

      if(!page){
        header.textContent = 'Información';
        meta.textContent = pageKey;
        title.textContent = 'Contenido no configurado';
        intro.textContent = 'Define esta pestaña en content.js dentro de window.PAGES.';
        content.innerHTML = `<div class="info-box"><h3>Falta window.PAGES["${esc(pageKey)}"]</h3></div>`;
        return;
      }

      header.textContent = page.navLabel || page.title || 'Información';
      meta.textContent = page.updated ? `Actualizado: ${page.updated}` : '—';

      title.textContent = page.title || '';
      intro.textContent = page.intro || '';

      const icon = safe(page.icon);
      const primaryUrl = safe(page.primaryUrl);
      const primaryLabel = esc(page.primaryLabel || 'Abrir');
      const description = esc(page.description || page.intro || '');

      const badges = (page.badges || []).map(b => {
        const isRed = (b.color || '').toLowerCase() === 'red';
        return `<span class="badge ${isRed ? 'red' : ''}">${esc(b.label || '')}</span>`;
      }).join('');

      const hero = `
        <div class="tool-hero">
          <div class="tool-hero-ico">
            ${icon ? `<img src="${esc(icon)}" alt="">` : `<div class="fallback">${esc(FALLBACK(page.heroTitle || page.title || page.navLabel))}</div>`}
          </div>
          <div class="tool-hero-main">
            <p class="tool-hero-title">${esc(page.heroTitle || page.title || page.navLabel || 'Herramienta')}</p>
            <p class="tool-hero-desc">${description}</p>
            <div class="tool-hero-actions">
              ${primaryUrl ? `<a class="btn primary" target="_blank" rel="noopener" href="${esc(primaryUrl)}">${primaryLabel}</a>` : ``}
              ${page.secondaryUrl ? `<a class="btn" target="_blank" rel="noopener" href="${esc(page.secondaryUrl)}">${esc(page.secondaryLabel || 'Abrir enlace')}</a>` : ``}
            </div>
            ${badges ? `<div class="badge-row">${badges}</div>` : ``}
          </div>
        </div>
      `;

      const blocks = page.blocks || [];
      const blocksHtml = blocks.map(b => {
        const bullets = (b.bullets || []).map(x => `<li>${esc(x)}</li>`).join('');
        const steps = (b.steps || []).map(x => `<li>${esc(x)}</li>`).join('');
        const links = (b.links || []).map(l =>
          `<a class="btn" target="_blank" rel="noopener" href="${esc(l.url)}">${esc(l.label)}</a>`
        ).join('');
        const contact = b.contact
          ? `<a class="btn red" target="_blank" rel="noopener" href="${esc(b.contactUrl || '#')}">${esc(b.contact)}</a>`
          : '';

        return `
          <div class="info-box">
            <h3>${esc(b.title || '')}</h3>
            ${b.text ? `<p>${esc(b.text)}</p>` : ''}
            ${bullets ? `<ul>${bullets}</ul>` : ''}
            ${steps ? `<ol class="steps">${steps}</ol>` : ''}
            ${(links || contact) ? `<div class="info-actions">${links}${contact}</div>` : ''}
          </div>
        `;
      }).join('');

      content.innerHTML = hero + blocksHtml;

      const img = content.querySelector('.tool-hero-ico img');
      if(img){
        img.addEventListener('error', () => {
          const box = content.querySelector('.tool-hero-ico');
          box.innerHTML = `<div class="fallback">${esc(FALLBACK(page.heroTitle || page.title || page.navLabel))}</div>`;
        });
      }
    }

    function initNav(){
      const home = document.querySelector('.nav-item[data-view="tools"]');
      home?.addEventListener('click', (e) => {
        e.preventDefault();
        setActiveNav(home);
        showTools();
      });

      document.querySelectorAll('.nav-item[data-page]').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          setActiveNav(a);
          showPage(a.dataset.page);
        });
      });
    }

    renderTools();
    renderFeed(window.COMUNICADOS || [], 'comunicados', 'commCount');
    renderFeed(window.NOTICIAS || [], 'noticias', 'newsCount');
    initNav();
  </script>
</body>
</html>
