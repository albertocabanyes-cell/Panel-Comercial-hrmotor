<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Panel Comercial</title>

  <style>
    /* ===== Cabecera visual de herramienta por pestaña (hero) ===== */
.tool-hero{
  grid-column: 1 / -1;
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:12px;
  border:1px solid #E6EAF2;
  border-radius:10px;
  background: linear-gradient(180deg, #FFFFFF, #F7F9FD);
}

.tool-hero-ico{
  width:56px;
  height:56px;
  border-radius:14px;
  border:1px solid #E2E8F0;
  background:#F2F5FB;
  display:grid;
  place-items:center;
  overflow:hidden;
  flex: 0 0 auto;
}

.tool-hero-ico img{
  width:34px;
  height:34px;
  object-fit:contain;
  display:block;
}

.tool-hero-ico .fallback{
  font-weight:950;
  color:#243B7A;
  font-size:14px;
}

.tool-hero-main{
  flex:1 1 auto;
  min-width:0;
}

.tool-hero-title{
  margin:0;
  font-size:15.5px;
  font-weight:950;
  line-height:1.15;
}

.tool-hero-desc{
  margin:6px 0 0;
  color: var(--muted);
  font-size:12.8px;
  line-height:1.35;
}

.tool-hero-actions{
  margin-top:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn.primary{
  background: var(--navy);
  border-color: var(--navy);
  color:#fff;
}
.btn.primary:hover{
  background: var(--navy-2);
  border-color: var(--navy-2);
}

.badge-row{
  margin-top:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  border-radius:999px;
  border:1px solid #E4E9F3;
  background:#F7F9FD;
  color:#334155;
  font-size:11.5px;
  font-weight:850;
}
.badge.red{
  border-color: rgba(185,28,28,.25);
  background: rgba(185,28,28,.08);
  color: var(--danger);
}

/* Pasos (checklist) más visual */
.steps{
  margin:8px 0 0;
  padding-left:18px;
  color: var(--text);
  font-size:12.6px;
  line-height:1.4;
}
.steps li{ margin:6px 0; }
  </style>
</head>

<body>
  <!-- Header blanco -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="global-search" aria-label="Búsqueda global">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2"/>
          <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" placeholder="Search…" />
      </div>

      <div class="logo">
        <!-- Sube tu logo a assets/brand/hrmotor-logo.png o cambia la ruta -->
        <img src="assets/brand/hrmotor-logo.png" alt="HRmotor" />
      </div>

<div class="userbox">
  <div class="avatar" id="userInitials">HR</div>
  <div class="caret" aria-hidden="true"></div>
</div>
    </div>
  </header>

 <!-- Barra azul (tabs internos) -->
<nav class="navbar" aria-label="Navegación">
  <div class="navbar-inner">
    <!-- Home (Herramientas) -->
    <a class="nav-item active" data-view="tools" href="#" onclick="return false;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z"
              stroke="white" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </a>

    <!-- Tabs (contenido interno) -->
    <a class="nav-item" data-page="acceso_web" href="#" onclick="return false;">Acceso Web</a>
    <a class="nav-item" data-page="my_mutua" href="#" onclick="return false;">My Mutua</a>
    <a class="nav-item" data-page="serviceform" href="#" onclick="return false;">Serviceform</a>
    <a class="nav-item" data-page="whatsapp_web" href="#" onclick="return false;">WhatsApp Web</a>
    <a class="nav-item" data-page="lendismart" href="#" onclick="return false;">Lendismart</a>
    <a class="nav-item" data-page="docusign" href="#" onclick="return false;">DocuSign</a>
    <a class="nav-item" data-page="woffu" href="#" onclick="return false;">Woffu</a>
  </div>
</nav>

  <!-- Layout -->
  <main class="wrap">
    <!-- Columna izquierda: cambia entre Herramientas y Página -->
    <div>
      <!-- Vista: Herramientas -->
      <section id="toolsCard" class="card" aria-label="Herramientas">
        <div class="card-h">
          <div class="title">Herramientas</div>
          <div style="color:var(--muted); font-size:12px; font-weight:800;">Accesos directos</div>
        </div>
        <div class="card-b">
          <div id="tools" class="tools-grid"></div>
          <div class="muted-note">
            Nota: los accesos se abren en una nueva pestaña para evitar bloqueos por iframes (SharePoint/SSO).
          </div>
        </div>
      </section>

      <!-- Vista: Página de información (protocolos/guías) -->
      <section id="pageCard" class="card hide" aria-label="Información">
        <div class="card-h">
          <div class="title" id="pageHeader">Información</div>
          <div style="color:var(--muted); font-size:12px; font-weight:800;" id="pageMeta">—</div>
        </div>
        <div class="card-b">
          <p class="page-title" id="pageTitle">—</p>
          <p class="page-sub" id="pageIntro">—</p>
          <div id="pageContent" class="info-grid"></div>
        </div>
      </section>
    </div>

    <!-- Columna derecha: siempre visible -->
    <aside>
      <button class="cta" type="button" onclick="alert('Acción a definir: aquí podrías enlazar a Salesforce/crear tarea');">
        Crear tarea
      </button>

      <section class="card" aria-label="Comunicados">
        <div class="card-h">
          <div class="title">Comunicados</div>
          <div id="commCount" style="color:var(--muted); font-size:12px; font-weight:800;">—</div>
        </div>
        <div class="card-b">
          <div id="comunicados" class="feed"></div>
        </div>
      </section>

      <div style="height:12px;"></div>

      <section class="card" aria-label="Noticias">
        <div class="card-h">
          <div class="title">Noticias</div>
          <div id="newsCount" style="color:var(--muted); font-size:12px; font-weight:800;">—</div>
        </div>
        <div class="card-b">
          <div id="noticias" class="feed"></div>
        </div>
      </section>
    </aside>
  </main>

  <!-- IMPORTANTÍSIMO: en content.js usa window.TOOLS / window.COMUNICADOS / window.NOTICIAS / window.PAGES -->
  <script src="content.js?v=1"></script>

  <script>
    const FALLBACK = (name) => (name || 'H').trim().slice(0,2).toUpperCase();
    const safe = (v) => (v ?? '').toString();

    // ===== Render Herramientas =====
    function renderTools(){
      const root = document.getElementById('tools');
      root.innerHTML = '';

      const tools = (window.TOOLS || []);
      tools.forEach(t => {
        const a = document.createElement('a');
        a.className = 'tool';
        a.href = t.url || '#';
        a.target = '_blank';
        a.rel = 'noopener';

        const icon = safe(t.icon);
        const group = safe(t.group);
        const badge = safe(t.badge);
        const status = safe(t.status);

        a.innerHTML = `
          <div class="tool-ico">
            ${icon ? `<img src="${icon}" alt="">` : `<div class="fallback">${FALLBACK(t.name)}</div>`}
          </div>
          <div class="tool-txt">
            <p class="tool-name">${safe(t.name)}</p>
            <p class="tool-desc">${safe(t.desc)}</p>
            <div class="tool-meta">
              ${group ? `<span class="tag">${group}</span>` : ``}
              ${badge ? `<span class="tag">${badge}</span>` : ``}
              ${status ? `<span class="tag red">${status}</span>` : ``}
            </div>
          </div>
        `;

        const img = a.querySelector('img');
        if(img){
          img.addEventListener('error', () => {
            img.remove();
            const box = a.querySelector('.tool-ico');
            box.innerHTML = `<div class="fallback">${FALLBACK(t.name)}</div>`;
          });
        }

        root.appendChild(a);
      });
    }

    // ===== Render Comunicados / Noticias =====
    function renderFeed(list, containerId, countId){
      const el = document.getElementById(containerId);
      const countEl = document.getElementById(countId);
      const items = (list || []).slice();

      if(countEl) countEl.textContent = items.length ? `${items.length}` : '—';

      el.innerHTML = '';
      items.forEach(n => {
        const div = document.createElement('div');
        div.className = 'feed-item';

        const title = safe(n.title);
        const date = safe(n.date);
        const text = safe(n.text);
        const link = safe(n.link);
        const pdf = safe(n.pdf);
        const image = safe(n.image);

        div.innerHTML = `
          <div class="feed-top">
            <p class="feed-title">${title}</p>
            <span class="feed-date">${date}</span>
          </div>
          <p class="feed-text">${text}</p>
          <div class="feed-actions">
            ${link ? `<a class="btn" href="${link}" target="_blank" rel="noopener">Abrir enlace</a>` : ''}
            ${pdf ? `<a class="btn red" href="${pdf}" target="_blank" rel="noopener">Ver PDF</a>` : ''}
            ${image ? `<a class="btn" href="${image}" target="_blank" rel="noopener">Ver imagen</a>` : ''}
          </div>
        `;
        el.appendChild(div);
      });
    }

    // ===== Tabs internos: Tools vs Páginas =====
    function setActiveNav(el){
      document.querySelectorAll('.nav-item').forEach(a => a.classList.remove('active'));
      if(el) el.classList.add('active');
    }
F
    function showTools(){
      document.getElementById('toolsCard').classList.remove('hide');
      document.getElementById('pageCard').classList.add('hide');
    }

    function showPage(pageKey){
      const pages = (window.PAGES || {});
      const page = pages[pageKey];

      document.getElementById('toolsCard').classList.add('hide');
      document.getElementById('pageCard').classList.remove('hide');

      const header = document.getElementById('pageHeader');
      const meta = document.getElementById('pageMeta');
      const title = document.getElementById('pageTitle');
      const intro = document.getElementById('pageIntro');
      const content = document.getElementById('pageContent');

      if(!page){
        header.textContent = 'Información';
        meta.textContent = pageKey;
        title.textContent = 'Contenido no configurado';
        intro.textContent = 'Define esta pestaña en content.js dentro de window.PAGES.';
        content.innerHTML = `
          <div class="info-box">
            <h3>Cómo activarlo</h3>
            <p>Crea <b>window.PAGES["${pageKey}"]</b> con title/intro/blocks.</p>
            <div class="info-actions">
              <a class="btn" href="#" onclick="return false;">OK</a>
            </div>
          </div>`;
        return;
      }

      header.textContent = page.navLabel || page.title || 'Información';
      meta.textContent = page.updated ? `Actualizado: ${page.updated}` : '—';
      title.textContent = page.title || '—';
      intro.textContent = page.intro || '';

      const blocks = page.blocks || [];
      content.innerHTML = blocks.map(b => {
        const bullets = (b.bullets || []).map(x => `<li>${x}</li>`).join('');
        const links = (b.links || []).map(l => `<a class="btn" target="_blank" rel="noopener" href="${l.url}">${l.label}</a>`).join('');
        const contact = b.contact ? `<a class="btn red" href="${b.contactUrl || '#'}" target="_blank" rel="noopener">${b.contact}</a>` : '';
        return `
          <div class="info-box">
            <h3>${b.title || ''}</h3>
            ${b.text ? `<p>${b.text}</p>` : ''}
            ${bullets ? `<ul>${bullets}</ul>` : ''}
            ${(links || contact) ? `<div class="info-actions">${links}${contact}</div>` : ''}
          </div>`;
      }).join('');
    }

    // ===== Init + listeners =====
    function initNav(){
      // Home
      const home = document.querySelector('.nav-item[data-view="tools"]');
      home?.addEventListener('click', (e) => {
        e.preventDefault();
        setActiveNav(home);
        showTools();
      });

      // Páginas
      document.querySelectorAll('.nav-item[data-page]').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          setActiveNav(a);
          showPage(a.dataset.page);
        });
      });
    }

    // Init render
    renderTools();
    renderFeed(window.COMUNICADOS || [], 'comunicados', 'commCount');
    renderFeed(window.NOTICIAS || [], 'noticias', 'newsCount');
    initNav();
  </script>
</body>
</html>
